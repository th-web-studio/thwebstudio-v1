<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | TH WEB STUDIO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="nav-placeholder"></div>

    <main class="container section-padding" style="margin-top: 85px;">
        <div class="contact-header">
            <span class="eyebrow">GET IN TOUCH</span>
            <h1 style="font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 900; margin: 20px 0;">Let's build <br><span class="blue-text">something solid.</span></h1>
        </div>

        <div class="premium-grid" style="margin-top: 60px;">
            <!-- LEFT COLUMN: THE PROJECT FORM -->
            <div class="studio-body">
                <form action="#" class="contact-form" id="project-form">
                    <div class="form-header">
                        <h3 class="blue-text" style="margin-bottom: 10px;">Project Inquiry</h3>
                        <p style="margin-bottom: 30px; opacity: 0.6;">Tell us about your business goals and we'll reach out within 24 hours.</p>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" placeholder="Full Name" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" placeholder="(606) 691-0471" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="thwebstudio@outlook.com" required>
                    </div>

                    <div class="form-group">
                        <label>Service Needed</label>
                        <select name="project-type">
                            <option value="new-site">New Business Website</option>
                            <option value="redesign">Website Redesign</option>
                            <option value="custom-tool">Custom Business Tool</option>
                            <option value="other">Other Inquiry</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>How can we help?</label>
                        <textarea name="message" rows="5" placeholder="Briefly describe your project..."></textarea>
                    </div>

                    <button type="submit" class="nav-cta-button" style="width: 100%; border: none; cursor: pointer;">Send Inquiry</button>
                </form>
            </div>

            <!-- RIGHT COLUMN: ANCHORED BUBBLES -->
            <div class="studio-label" style="display: flex; flex-direction: column; gap: 20px;">
                <div class="info-card highlight-card">
                    <h3 class="section-title" style="margin-bottom: 15px;">Direct Line</h3>
                    <p class="phone-display">(606) 691-0471</p>
                    
                    <!-- BUBBLES ANCHORED UNDER PHONE -->
                    <div class="card-actions">
                        <a href="tel:6066910471" class="bubble-btn">
                            <span class="bubble-icon">📞</span> Call
                        </a>
                        <a href="sms:6066910471" class="bubble-btn">
                            <span class="bubble-icon">💬</span> Text
                        </a>
                    </div>
                </div>

                <div class="info-card">
                    <h3 class="section-title" style="margin-bottom: 15px;">Email</h3>
                    <p style="font-weight: 700; margin-bottom: 15px;">thwebstudio@outlook.com</p>
                    
                    <!-- BUBBLE ANCHORED UNDER EMAIL -->
                    <div class="card-actions">
                        <a href="mailto:thwebstudio@outlook.com" class="bubble-btn">
                            <span class="bubble-icon">✉️</span> Email Us
                        </a>
                    </div>
                </div>

                <div class="info-card" style="opacity: 0.6;">
                    <h3 class="section-title" style="margin-bottom: 10px;">Availability</h3>
                    <p style="font-size: 0.9rem;">Accepting local partners for Q2 & Q3 2026.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
