<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- THE GUARANTEE: STOPS AUTOMATIC PHONE LINKS -->
    <meta name="format-detection" content="telephone=no">
    
    <title>Contact | TH WEB STUDIO</title>
    <!-- CSS version sync -->
    <link rel="stylesheet" href="style.css?v=1.4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* MOBILE-FIRST HERO & PHONE PROTECTION */
        * { box-sizing: border-box; }
        
        h1 {
            overflow-wrap: break-word;
            word-wrap: break-word;
            line-height: 1.1;
        }

        /* Ensures the phone number stays Slate/Power Black */
        .phone-display-top {
            color: #0f172a !important;
            text-decoration: none !important;
            font-weight: 700;
        }

        /* Standard container constraints */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            margin: 0 auto;
        }

        /* Prevents horizontal scroll on smaller devices */
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        @media (max-width: 768px) {
            .top-contact-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body class="contact-page">

    <div id="nav-placeholder"></div>

    <main class="container section-padding" style="margin-top: 85px;">
        <div class="contact-header">
            <span class="eyebrow">GET IN TOUCH</span>
            <!-- Responsive clamp ensures no cutoff -->
            <h1 style="font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 900; margin: 20px 0 40px;">
                Let's build <br><span class="blue-text">something solid.</span>
            </h1>
            
            <div class="top-contact-grid">
                <!-- PHONE CARD -->
                <div class="info-card highlight-card">
                    <h3 class="section-title">Direct Line</h3>
                    <p class="phone-display-top">(606) 691-0471</p>
                    <div class="card-actions">
                        <a href="tel:6066910471" class="action-link-btn">
                            <span class="icon">📞</span> Call
                        </a>
                        <a href="sms:6066910471" class="action-link-btn">
                            <span class="icon">💬</span> Text
                        </a>
                    </div>
                </div>

                <!-- EMAIL CARD -->
                <div class="info-card">
                    <h3 class="section-title">Email Address</h3>
                    <p class="contact-detail-text">thwebstudio@outlook.com</p>
                    <div class="card-actions">
                        <a href="mailto:thwebstudio@outlook.com" class="action-link-btn wide-btn">
                            <span class="icon">✉️</span> Send Email
                        </a>
                    </div>
                </div>

                <!-- STATUS CARD -->
                <div class="info-card status-card">
                    <h3 class="section-title">Status</h3>
                    <p class="contact-detail-text">Accepting Projects</p>
                    <div class="status-indicator">
                        <span class="pulse-dot"></span> Available Now
                    </div>
                </div>
            </div>
        </div>

        <!-- PROJECT FORM -->
        <div class="premium-grid" style="margin-top: 60px;">
            <div class="studio-body" style="grid-column: 1 / span 12;">
                <form action="https://formspree.io/f/xwvajwwn" method="POST" class="contact-form" id="project-form">
                    
                    <div class="form-header-premium">
                        <h3 class="blue-text">Project Inquiry</h3>
                        <div class="header-line"></div>
                        <p>Share your business goals and we will reach out within 24 hours.</p>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" placeholder="First & Last Name" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" placeholder="(606) 000-0000" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="_replyto" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Project Details</label>
                        <textarea name="message" rows="6" placeholder="Briefly describe your project goals, timeline, or specific technical requirements..."></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="nav-cta-button" style="width: 100%; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-weight: 900;">
                        Submit Project Request
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

    <script>
      const form = document.getElementById("project-form");
      const button = document.getElementById("submit-btn");

      form.addEventListener("submit", async function(event) {
        event.preventDefault();
        button.innerText = "SENDING...";
        button.disabled = true;

        const data = new FormData(event.target);
        
        fetch(event.target.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(response => {
          if (response.ok) {
            // Success redirect to your Cloudflare Pages thanks page
            window.location.href = "https://thwebstudio-v1.pages.dev/thanks.html";
          } else {
            button.innerText = "ERROR - TRY AGAIN";
            button.disabled = false;
            alert("There was a problem. Please try again.");
          }
        }).catch(error => {
          button.innerText = "ERROR - TRY AGAIN";
          button.disabled = false;
        });
      });
    </script>
</body>
</html>
