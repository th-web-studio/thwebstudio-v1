<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | TH WEB STUDIO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="contact-page">

    <div id="nav-placeholder"></div>

    <main class="container section-padding" style="margin-top: 85px;">
        <div class="contact-header">
            <span class="eyebrow">GET IN TOUCH</span>
            <h1 style="font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 900; margin: 20px 0 40px;">Let's build <br><span class="blue-text">something solid.</span></h1>
            
            <div class="top-contact-grid">
                <div class="info-card highlight-card">
                    <h3 class="section-title">Direct Line</h3>
                    <p class="phone-display-top">(606) 691-0471</p>
                    <div class="card-actions">
                        <a href="tel:6066910471" class="bubble-btn">📞 Call</a>
                        <a href="sms:6066910471" class="bubble-btn">💬 Text</a>
                    </div>
                </div>

                <div class="info-card">
                    <h3 class="section-title">Email Address</h3>
                    <p class="contact-detail-text">thwebstudio@outlook.com</p>
                    <div class="card-actions">
                        <a href="mailto:thwebstudio@outlook.com" class="bubble-btn">✉️ Email Us</a>
                    </div>
                </div>

                <div class="info-card status-card">
                    <h3 class="section-title">Status</h3>
                    <p class="contact-detail-text">Accepting new projects</p>
                    <span class="status-tag">Available Now</span>
                </div>
            </div>
        </div>

        <div class="premium-grid" style="margin-top: 60px;">
            <div class="studio-body" style="grid-column: 1 / span 12;">
                <!-- JAVASCRIPT REDIRECT INTEGRATED -->
                <form action="https://formspree.io/f/xwvajwwn" method="POST" class="contact-form" id="project-form">
                    
                    <div class="form-header-premium">
                        <h3 class="blue-text">Project Inquiry</h3>
                        <div class="header-line"></div>
                        <p>Tell us about your business goals and we'll reach out within 24 hours.</p>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" placeholder="First & Last Name" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" placeholder="(000) 000-0000" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="_replyto" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Project Details</label>
                        <textarea name="message" rows="6" placeholder="Tell us about your project goals, timeline, or specific needs..."></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="nav-cta-button" style="width: 100%; border: none; cursor: pointer;">
                        Submit Project Request
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

    <!-- NEW REDIRECT SCRIPT -->
    <script>
      const form = document.getElementById("project-form");
      const button = document.getElementById("submit-btn");

      form.addEventListener("submit", async function(event) {
        event.preventDefault();
        button.innerText = "Sending...";
        button.disabled = true;

        const data = new FormData(event.target);
        
        fetch(event.target.action, {
          method: 'POST',
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        }).then(response => {
          if (response.ok) {
            // Success: Force redirect to your solid thank you page
            window.location.href = "https://thwebstudio-v1.pages.dev/thanks.html";
          } else {
            button.innerText = "Error - Try Again";
            button.disabled = false;
            alert("There was a problem. Please try again or email us directly.");
          }
        }).catch(error => {
          button.innerText = "Error - Try Again";
          button.disabled = false;
          alert("Network error. Please check your connection.");
        });
      });
    </script>
</body>
</html>
