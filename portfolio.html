<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | TH WEB STUDIO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="nav-placeholder"></div>

    <main class="section-padding container">
        <h2 class="section-title">Selected Work</h2>
        <h1>Phipps Excavating & <br>Land Management</h1>
        <p style="max-width: 600px; margin-bottom: 40px; color: #94a3b8;">Professional digital presence for a rural service leader. Built for authority and mobile performance.</p>
        
        <div class="card" style="margin-bottom: 60px;">
            <h3 style="color: #2563eb; margin-bottom: 15px;">Project Scope</h3>
            <ul class="list-style" style="list-style: none; padding: 0;">
                <li>• Custom Service Architecture</li>
                <li>• Mobile-First Performance</li>
                <li>• Local SEO Foundation</li>
            </ul>
        </div>

        <!-- NEW: GALLERY GRID -->
        <div class="portfolio-gallery">
            <div class="gallery-item"><img src="images/phipps-1.jpg" alt="Phipps 1" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-2.jpg" alt="Phipps 2" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-3.jpg" alt="Phipps 3" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-4.jpg" alt="Phipps 4" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-5.jpg" alt="Phipps 5" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-6.jpg" alt="Phipps 6" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-7.jpg" alt="Phipps 7" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-8.jpeg" alt="Phipps 8" onclick="openLightbox(this.src)"></div>
            <div class="gallery-item"><img src="images/phipps-9.jpg" alt="Phipps 9" onclick="openLightbox(this.src)"></div>
        </div>
    </main>

    <!-- NEW: LIGHTBOX OVERLAY -->
    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <span class="close-lightbox">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged view">
    </div>

    <footer>
        <div class="container" style="padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: #94a3b8;">
            © 2026 TH WEB STUDIO
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
