<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | TH WEB STUDIO</title>
    
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- THE GRID ENGINE --- */

        main.container {
            display: block !important; 
            width: 90% !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
            padding-top: 100px !important;
        }

        .portfolio-gallery {
            display: grid !important;
            /* Force 3 columns of exactly equal width */
            grid-template-columns: repeat(3, 1fr) !important; 
            gap: 15px !important;
            margin: 40px 0 !important;
        }

        .gallery-item {
            width: 100% !important;
            /* STRICT HEIGHT: This prevents the images from being "too large" */
            height: 250px !important; 
            overflow: hidden !important;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .gallery-item img {
            width: 100% !important;
            height: 100% !important;
            /* OBJECT-FIT COVER: This is the secret. 
               It crops the image to fit the 250px box perfectly 
               without stretching or blowing up the size. */
            object-fit: cover !important; 
            display: block !important;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        /* --- LIGHTBOX --- */
        .lightbox-overlay {
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95); 
            backdrop-filter: blur(10px);
            justify-content: center; 
            align-items: center;
        }

        .lightbox-img { 
            max-width: 85%; 
            max-height: 80vh; 
            object-fit: contain; 
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .portfolio-gallery { grid-template-columns: repeat(2, 1fr) !important; }
            .gallery-item { height: 220px !important; }
        }
        @media (max-width: 600px) {
            .portfolio-gallery { grid-template-columns: 1fr !important; }
            .gallery-item { height: 200px !important; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <main class="container">
        <h2 style="color: #2563eb; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 900; margin-bottom: 10px;">Selected Work</h2>
        <h1 style="font-weight: 900; margin-bottom: 20px;">Phipps Excavating</h1>
        
        <div class="card" style="margin-bottom: 40px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 30px;">
            <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin: 0;">
                Professional digital branding and service architecture designed for a rural industry leader.
            </p>
        </div>

        <div class="portfolio-gallery">
            <div class="gallery-item"><img src="images/phipps-1.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-2.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-3.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-4.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-5.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-6.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-7.jpg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-8.jpeg" onclick="openLbox(this)"></div>
            <div class="gallery-item"><img src="images/phipps-9.jpg" onclick="openLbox(this)"></div>
        </div>
    </main>

    <div id="lbox" class="lightbox-overlay" onclick="this.style.display='none'">
        <img id="lbox-img" class="lightbox-img" src="">
    </div>

    <script>
        function openLbox(el) {
            document.getElementById('lbox-img').src = el.src;
            document.getElementById('lbox').style.display = 'flex';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
